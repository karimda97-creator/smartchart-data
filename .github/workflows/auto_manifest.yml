name: Generate Manifest on Release

on:
  release:
    types:
      - published
name: Generate Manifest on Release

on:
  release:
    types:
      - published
      - edited

  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to test
        required: true
        default: data-v1

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set Release Tag
        id: release_tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            echo "TAG_NAME=$EVENT_TAG" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=$MANUAL_TAG" >> "$GITHUB_ENV"
          fi

          echo "Release tag: ${EVENT_TAG:-$MANUAL_TAG}"

      - name: Download Release CSV assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          set -e

          echo "Getting Release information..."

          API_URL="https://api.github.com/repos/$REPO/releases/tags/$TAG_NAME"

          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" \
            -o release.json

          echo "Release assets:"

          jq -r '.assets[] | "\(.id) \(.name)"' release.json

          mkdir -p release_assets

          jq -r '
            .assets[]
            | select(.name | endswith(".csv"))
            | "\(.id)|\(.name)"
          ' release.json |
          while IFS='|' read -r ASSET_ID ASSET_NAME
          do
            echo ""
            echo "Downloading: $ASSET_NAME"

            curl -fsSL \
              -L \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" \
              -o "release_assets/$ASSET_NAME"
          done

          echo ""
          echo "Downloaded CSV files:"
          ls -lh release_assets/

      - name: Generate Manifest
        env:
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          cp release_assets/*.csv .
          python scripts/generate_manifest.py

      - name: Show Generated Manifest
        run: |
          echo "================ MANIFEST ================"
          cat manifest.json
          echo "=========================================="

      - name: Upload Manifest to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          python scripts/upload_manifest.py
MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            echo "TAG_NAME=$EVENT_TAG" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=$MANUAL_TAG" >> "$GITHUB_ENV"
          fi

      - name: Generate Manifest
        env:
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: python scripts/generate_manifest.py

      - name: Upload Manifest to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: python scripts/upload_manifest.py
