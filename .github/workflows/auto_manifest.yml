name: Generate and Upload Manifest

on:
  # 1. اجرای خودکار هنگام انتشار یا ویرایش ریلیز
  release:
    types: [published, edited]

  # 2. امکان اجرای دستی از تب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    # 🛑 شرط اختصاصی: فقط برای تگ data-v1 یا اجرای دستی فعال می‌شود
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'data-v1'
    runs-on: ubuntu-latest

    steps:
      # 1. تنظیم نام تگ هدف
      - name: Set Target Tag
        run: |
          echo "TARGET_TAG=data-v1" >> $GITHUB_ENV
          echo "Target Release Tag: data-v1"

      # 2. دانلود سورس‌کد ریپوزیتوری (برای دسترسی به اسکریپت پایتون)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. تنظیم محیط پایتون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. دانلود تمامی فایل‌های Assets ریلیز data-v1
      - name: Download CSV Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          cd data
          echo "Downloading CSV assets from release: $TARGET_TAG"
          
          gh release download "$TARGET_TAG" \
            --repo "${{ github.repository }}" || true

          echo "--------------------------------"
          echo "Downloaded files list:"
          ls -la
          echo "--------------------------------"

      # 5. ساخت فایل manifest.json
      - name: Generate manifest.json
        run: |
          python scripts/generate_manifest.py

      # 6. نمایش فایل مانیفست ساختاریافته در لاگ
      - name: Show generated manifest
        run: |
          cat manifest.json

      # 7. آپلود یا جایگزینی خودکار manifest.json در Assets ریلیز data-v1
      - name: Upload or Replace manifest.json in Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading updated manifest.json to release $TARGET_TAG..."
          gh release upload "$TARGET_TAG" manifest.json \
            --clobber \
            --repo "${{ github.repository }}"
