name: Generate Manifest on Release

on:
  release:
    types: [published, edited]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to test"
        required: true
        default: "test"

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set Release Tag
        id: release_tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            echo "TAG_NAME=$EVENT_TAG" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=$MANUAL_TAG" >> "$GITHUB_ENV"
          fi

      - name: Generate Manifest
        env:
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          python scripts/generate_manifest.py

      - name: Upload Manifest to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          python scripts/upload_manifest.pyname: Generate Manifest on Release

on:
release:
types: [published, edited]

workflow_dispatch:
inputs:
 run: |
      if [ -n "$EVENT_TAG" ]; then
        echo "TAG_NAME=$EVENT_TAG" >> "$GITHUB_ENV"
