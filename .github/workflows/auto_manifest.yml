name: Generate and Upload Manifest

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. data-v1)"
        required: true
        default: "data-v1"

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    steps:
      # 1. دانلود ریپوزیتوری (برای دسترسی به اسکریپت‌های پایتون)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تنظیم پایتون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. دانلود تمام فایل‌های CSV موجود در Release Assets
      - name: Download CSV Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          mkdir -p data
          cd data
          echo "Downloading CSV assets from release: $TAG_NAME"
          # دانلود همه فایل‌های CSV ریلیز
          gh release download "$TAG_NAME" --pattern "*.csv" --repo "$GITHUB_REPOSITORY" || true
          
          echo "Downloaded files:"
          ls -la

      # 4. اجرای اسکریپت ساخت مانیفست
      - name: Generate manifest.json
        run: |
          python scripts/generate_manifest.py

      # 5. نمایش مانیفست جهت اطمینان
      - name: Show generated manifest
        run: |
          cat manifest.json

      # 6. آپلود/جایگزینی مانیفست در Release Assets
      - name: Upload or Replace manifest.json in Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          echo "Uploading manifest.json to release $TAG_NAME..."
          # سوییچ clobber فایل قبلی را با همین نام اوررایت می‌کند
          gh release upload "$TAG_NAME" manifest.json --clobber --repo "$GITHUB_REPOSITORY"
