name: Generate and Upload Manifest

on:
  release:
    types: [created, published, edited]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    steps:

      # 1. تعیین تگ Release
      - name: Determine Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="data-v1"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          echo "TARGET_TAG=$TAG" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Release Tag: $TAG"
          echo "Event: ${{ github.event_name }}"
          echo "======================================"

      # 2. دریافت سورس پروژه
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # 3. تنظیم Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. نمایش Assetهای Release
      - name: Show Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================"
          echo "Assets in Release: $TARGET_TAG"
          echo "======================================"

          gh release view "$TARGET_TAG" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name'

      # 5. دانلود تمام CSVهای Release
      - name: Download CSV Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "Downloading CSV files"
          echo "======================================"

          rm -rf data
          mkdir -p data

          gh release download "$TARGET_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.csv" \
            --dir data \
            --clobber

          echo
          echo "Downloaded CSV files:"
          echo "--------------------------------------"

          find data -maxdepth 1 -type f -iname "*.csv" \
            -printf "%f\n" | sort

          CSV_COUNT=$(find data -maxdepth 1 -type f -iname "*.csv" | wc -l)

          echo "--------------------------------------"
          echo "CSV count: $CSV_COUNT"

          if [ "$CSV_COUNT" -eq 0 ]; then
            echo "ERROR: No CSV files found in Release Assets."
            exit 1
          fi

      # 6. نصب وابستگی Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 7. ساخت Manifest از روی CSVها
      - name: Generate manifest.json
        run: |
          python scripts/generate_manifest.py

      # 8. نمایش Manifest ساخته شده
      - name: Show generated manifest
        run: |
          echo "======================================"
          echo "Generated manifest.json"
          echo "======================================"

          cat manifest.json

      # 9. جایگزینی manifest.json در همان Release
      - name: Upload manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "Uploading manifest.json"
          echo "Release: $TARGET_TAG"
          echo "======================================"

          gh release upload "$TARGET_TAG" \
            manifest.json \
            --clobber \
            --repo "${{ github.repository }}"

          echo
          echo "======================================"
          echo "DONE"
          echo "======================================"
