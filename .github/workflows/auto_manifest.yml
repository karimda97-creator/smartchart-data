name: Generate and Upload Manifest

on:
  release:
    types: [edited, published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    steps:
      # 1. استخراج هوشمند نام تگ ریلیز
      - name: Determine Release Tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="data-v1"
          fi
          echo "TARGET_TAG=$TAG" >> $GITHUB_ENV
          echo "Processing Release Tag: $TAG"

      # 2. دریافت سورس‌کد
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. تنظیم پایتون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. دانلود Assets از ریلیز
      - name: Download CSV Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          cd data
          echo "Downloading CSV assets from release tag: $TARGET_TAG"
          
          gh release download "$TARGET_TAG" \
            --repo "${{ github.repository }}" || true

          echo "--------------------------------"
          echo "Downloaded files list:"
          ls -la
          echo "--------------------------------"

      # 5. ساخت مانیفست جدید
      - name: Generate manifest.json
        run: |
          python scripts/generate_manifest.py

      # 6. نمایش مانیفست
      - name: Show generated manifest
        run: |
          cat manifest.json

      # 7. آپلود و جایگزینی مانیفست در ریلیز
      - name: Upload or Replace manifest.json in Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading manifest.json to release $TARGET_TAG..."
          gh release upload "$TARGET_TAG" manifest.json \
            --clobber \
            --repo "${{ github.repository }}"
